<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index, follow">
<meta name="description" content="每日中文 Daily Chinese — a free 30-day course for adult ABCs: 300 characters to read, 100 to write, pinyin lessons, Microsoft neural-voice audio, and 8 printable pages a day.">
<link rel="canonical" href="https://www.phoebiewang.com/chinese/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>每日中文 Daily Chinese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column study desk — day strip on top, tabbed workspace, sticky bottom tab bar on phones */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece7; --ink:#18201d; --muted:#5d6a64; --line:#d5ddd7;
  --jade:#1f6f5c; --jade-soft:#d7ebe4; --seal:#c3382c; --seal-soft:#f7dcd8; --gold:#b98a2b; --ok:#1f7a4d; --bad:#c3382c;
  --hz:"Kaiti SC","STKaiti","KaiTi","BiauKai","Noto Serif SC",serif;
  --display:"Noto Serif SC","Songti SC",serif;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --r:10px; --onj:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#1a211e; --sunk:#232c28; --ink:#e8eeea; --muted:#9aa8a1; --line:#2f3a35;
  --jade:#5cc3a6; --jade-soft:#1e3a32; --seal:#ef6b5e; --seal-soft:#3d2321; --gold:#d9b25a; --ok:#5ccf93; --bad:#ef6b5e; --onj:#0c1a15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1a211e; --sunk:#232c28; --ink:#e8eeea; --muted:#9aa8a1; --line:#2f3a35;
  --jade:#5cc3a6; --jade-soft:#1e3a32; --seal:#ef6b5e; --seal-soft:#3d2321; --gold:#d9b25a; --ok:#5ccf93; --bad:#ef6b5e; --onj:#0c1a15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.seal{flex:none;width:44px;height:44px;border-radius:6px;background:var(--seal);color:#fff;font-family:var(--display);font-weight:900;font-size:15px;line-height:1.05;display:grid;place-items:center;text-align:center;letter-spacing:.05em;transform:rotate(-4deg)}
.brand h1{font-family:var(--display);font-size:24px;margin:0;font-weight:900;letter-spacing:.02em}
.brand p{margin:0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px}
.stat{text-align:right}
.stat b{font-family:var(--display);font-size:22px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.progress{height:6px;background:var(--sunk);border-radius:6px;margin:16px 0 8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);border-radius:6px;transition:width .4s}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}
.dchip{flex:none;width:44px;height:52px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-variant-numeric:tabular-nums}
.dchip small{font-size:9px;color:var(--muted);letter-spacing:.06em}
.dchip b{font-size:16px}
.dchip.on{border-color:var(--jade);background:var(--jade);color:var(--onj)}
.dchip.on small{color:var(--onj);opacity:.8}
.dchip.done::after{content:"完";position:absolute;top:-6px;right:-5px;width:18px;height:18px;border-radius:4px;background:var(--seal);color:#fff;font-family:var(--display);font-size:11px;display:grid;place-items:center;transform:rotate(8deg)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;margin:10px 0 18px}
.tab{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--muted)}
.tab b{font-family:var(--display);font-size:19px;color:var(--ink);line-height:1.2}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media (max-width:640px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;z-index:20;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
  .stats{width:100%;justify-content:space-between}.stat{text-align:left}
}
h2{font-family:var(--display);font-size:20px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--jade);border-color:var(--jade);color:var(--onj)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.ico{width:18px;height:18px;flex:none}
/* today bar */
.todaybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--jade-soft);border:1px solid color-mix(in srgb,var(--jade) 35%,transparent);border-radius:14px;padding:12px 14px;margin:14px 0 6px}
.todaybar .tl{display:flex;align-items:center;gap:12px;min-width:0}
.todaybar .big{font-family:var(--display);font-weight:900;font-size:22px;color:var(--jade);line-height:1.1}
.todaybar .meta{font-size:12.5px;color:var(--muted)}
.todaybar .meta b{color:var(--ink)}
.todaybar .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.print{background:var(--seal);border-color:var(--seal);color:var(--onj);font-size:15px;padding:11px 18px}
.dchip .now{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;background:var(--seal);color:#fff;border-radius:4px;padding:0 4px;white-space:nowrap}
.startset{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.startset select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%;min-width:0}
.startset input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
@media (max-width:640px){.todaybar .acts{width:100%}.todaybar .acts .btn{flex:1;justify-content:center}}
/* spaced review, readings, badges */
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--seal);text-decoration:underline;cursor:pointer}
.pycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:22px}
.pycard summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;list-style:none}
.pycard summary::-webkit-details-marker{display:none}
.pycard summary b{font-family:var(--display);font-size:20px}
.pyen{color:var(--muted);font-size:13px}
.pygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.pyit{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.pysym{font-size:28px;font-weight:700;color:var(--seal);line-height:1.1}
.pytip{font-size:13px;color:var(--muted)}
.pyexs{display:flex;flex-wrap:wrap;gap:6px}
.pyex{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;min-width:52px}
.pyex b{font-size:14px;color:var(--jade)}
.pyex span{font-family:var(--hz);font-size:20px}
.pydict{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pydbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.duebar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--seal-soft);border:1px solid color-mix(in srgb,var(--seal) 30%,transparent);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.duebar b{font-family:var(--display);font-size:18px;display:block}
.duebar span{font-size:13px;color:var(--muted)}
.duehz{font-family:var(--hz);font-size:24px;letter-spacing:.08em;margin-top:4px;word-break:break-all}
.fc .b .pt{font-size:12px;color:var(--jade);font-weight:600}
.passage{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.ptext{font-family:var(--hz);font-size:26px;line-height:2.1}
.ptext .pc2{font:inherit;border:0;background:none;padding:0;color:var(--ink);position:relative;border-radius:4px}
.ptext .pc2:hover{background:var(--jade-soft)}
.ptext .pc2.show::after{content:attr(data-show);position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-family:var(--body);font-size:11px;color:var(--jade);white-space:nowrap}
.ptext ruby.new{color:var(--muted)}
.ptext rt{font-family:var(--body);font-size:11px}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.rstats{grid-template-columns:repeat(2,1fr)}}
.rs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rs b{font-family:var(--display);font-size:26px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.rs b small{font-size:14px;color:var(--muted);font-weight:500}
.rs span{font-size:11.5px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bdg{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--sunk);color:var(--muted);font-weight:600}
.bdg.on{background:color-mix(in srgb,var(--gold) 22%,var(--surface));color:var(--ink)}
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.wchip.wdue{border-color:var(--seal);background:var(--seal-soft)}
/* pdf progress overlay */
.busy{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;padding:24px}
.busy .bx{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.busy .bx b{font-family:var(--display);font-size:18px;display:block;margin-bottom:6px}
.busy .bb{height:8px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:12px 0 6px}
.busy .bb i{display:block;height:100%;background:var(--seal);transition:width .2s}
/* printable sheets */
.sheetwrap{width:100%;overflow:hidden}
#sheets .page{background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.14);margin:0 0 24px;border-radius:2px}
@media print{
  @page{size:letter;margin:0}
  body{background:#fff!important}
  body *{visibility:hidden}
  #sheets,#sheets *{visibility:visible}
  #sheets{position:absolute;left:0;top:0;zoom:1!important}
  #sheets .page{box-shadow:none;margin:0;border-radius:0;page-break-after:always;break-after:page}
  .tabs,.toast{display:none!important}
  :root{padding:0!important}
}
/* learn */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.fc{perspective:900px;height:210px;border:0;background:none;padding:0;text-align:left}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:14px;display:flex;flex-direction:column}
.fc .f{align-items:center;justify-content:center}
.fc .f .hz{font-family:var(--hz);font-size:96px;line-height:1}
.fc .f .tagw{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--seal);font-weight:700}
.fc .f .lv{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.fc .f .lv i{width:6px;height:6px;border-radius:50%;background:var(--sunk)}
.fc .f .lv i.y{background:var(--jade)}
.fc .b{transform:rotateY(180deg);background:var(--jade-soft);gap:4px}
.fc .b .py{font-size:26px;font-weight:700;color:var(--jade)}
.fc .b .en{font-size:13px;color:var(--muted)}
.fc .b .w{margin-top:auto;font-family:var(--hz);font-size:28px}
.fc .b .wp{font-size:13px}
.fc .b .we{font-size:12px;color:var(--muted)}
.spk{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:2}
.sents{display:grid;gap:10px;margin-top:22px}
.sent{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sent ruby{font-family:var(--hz);font-size:26px;margin:0 2px}
.sent rt{font-family:var(--body);font-size:11px;color:var(--muted)}
.sent .en{font-size:13px;color:var(--muted)}
.sent .pc{font-family:var(--hz);font-size:26px}
.hidepy rt{visibility:hidden}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.qbar{flex:1;height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--jade)}
.qtype{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--seal);font-weight:700}
.prompt{min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:8px 0 18px}
.prompt .hz{font-family:var(--hz);font-size:88px;line-height:1.05}
.prompt .q{font-size:20px;font-weight:600}
.prompt .sz{font-family:var(--hz);font-size:34px;line-height:1.4}
.prompt .gap{display:inline-block;width:1.2em;border-bottom:3px solid var(--jade);margin:0 4px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 10px;font-size:18px;font-weight:600;min-height:64px}
.opt.hz{font-family:var(--hz);font-size:40px;font-weight:400;padding:6px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.bad{border-color:var(--bad);background:var(--seal-soft)}
.fb{margin-top:14px;min-height:52px;padding:12px 14px;border-radius:10px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fb.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fb.bad{background:var(--seal-soft)}
.fb .hzs{font-family:var(--hz);font-size:22px}
/* result */
.result{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
@media (max-width:560px){.result{grid-template-columns:1fr;justify-items:center}}
.ring{width:150px;height:150px}
.ring text{font-family:var(--display)}
.bars{display:grid;gap:9px;width:100%;min-width:0}
.bar{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:6px}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.verdict{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-weight:700;font-size:13px}
/* write */
.wlist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wchip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:56px;height:56px;font-family:var(--hz);font-size:32px}
.wchip.on{border-color:var(--jade);background:var(--jade-soft)}
.wstage{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:22px;align-items:start}
@media (max-width:640px){.wstage{grid-template-columns:1fr}}
.pad{position:relative;width:100%;max-width:300px;aspect-ratio:1;border:2px solid var(--seal);border-radius:6px;background:var(--surface);touch-action:none}
.pad::before,.pad::after{content:"";position:absolute;pointer-events:none}
.pad::before{left:50%;top:0;bottom:0;border-left:1px dashed color-mix(in srgb,var(--seal) 55%,transparent)}
.pad::after{top:50%;left:0;right:0;border-top:1px dashed color-mix(in srgb,var(--seal) 55%,transparent)}
.pad .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hz);font-size:230px;line-height:1;color:var(--ink);opacity:.13;pointer-events:none}
.pad canvas,.pad .hw{position:absolute;inset:0;width:100%;height:100%}
.winfo .hz{font-family:var(--hz);font-size:54px;line-height:1}
.winfo .py{font-size:22px;font-weight:700;color:var(--jade)}
.winfo ol{padding-left:18px;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;background:var(--sunk);color:var(--muted);font-weight:600}
/* review */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.rc{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center}
.rc .hz{font-family:var(--hz);font-size:30px;line-height:1.1}
.rc .m{display:flex;gap:2px;margin-top:3px}
.rc .m i{width:5px;height:5px;border-radius:50%;background:var(--sunk)}
.rc .m i.y{background:var(--jade)}
.rc.weak{border-color:var(--seal);background:var(--seal-soft)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin:10px 0 14px;flex-wrap:wrap}
/* print */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.pg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.pg b{font-family:var(--display);font-size:16px;display:block}
.pg span{font-size:12px;color:var(--muted)}
.pg em{font-style:normal;font-size:11px;color:var(--seal);font-weight:700;letter-spacing:.08em}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.pri,a.btn.print{color:var(--onj)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;z-index:40}
@media (prefers-reduced-motion:reduce){.fc .in,.progress i{transition:none}}
</style>
<style>.sheets{
  --ink:#1d1a17; --soft:#6b625a; --red:#c2412d; --grid:#e3a597; --trace:#cfc8c2; --line:#d9d2cb; --wash:#faf5f1;
  --hanzi:"Kaiti SC","STKaiti","KaiTi","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  --serif:"Noto Serif SC","Noto Serif CJK SC","Songti SC",serif;
  --latin:"Figtree","Helvetica Neue",Arial,sans-serif;font-family:var(--latin);color:var(--ink);line-height:1.25}
.sheets{
*{box-sizing:border-box;margin:0;padding:0}

.page{width:8.5in;height:11in;padding:.5in .55in .45in;position:relative;page-break-after:always;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px}
.hd .l{display:flex;align-items:baseline;gap:12px}

function mark(base,t){
  if(!t) return base;

<script>window.SHEETS=(function(){const {D,day,reviewChars,toneOptions,rng,shuffle,writeUpTo,cnNum}=ABC;

  return L.words.map(([w,p])=>{ const syl=p.split(' '); let k=syl.findIndex(y=>{const [i]=splitSyl(y); return L.type==='i'?!!i&&!'yw'.includes(i):true;}); if(k<0)k=0;

const pyFoot=(n,pp)=>`<div class="ft"><span>每日中文 · Daily Chinese for ABC adults</span><span>Day ${n} — ${pp}/8</span></div>`;
function pyLesson(d){ const L=PY[d.n-1]; if(!L) return '';
  const items=L.items.map(it=>`<div class="pyi"><div class="sym">${esc(it.sym)}</div><div class="tip">${esc(it.tip)}</div><div class="exs">${it.ex.map(([y,z])=>`<div class="ex"><b>${y}</b><span>${z}</span></div>`).join('')}</div></div>`).join('');
  const words=L.words.map(([w,p])=>`<div class="pyw"><b>${p}</b><span>${w}</span></div>`).join('');
  return `<div class="page">${pyHead(d.n,1,'拼音课','Pinyin lesson')}
   <div class="sec"><h3><span class="tag">第 ${d.n} 课</span>${esc(L.zh)} <em>${esc(L.en)}</em></h3>
   <div class="note">Say each example out loud. In the app, the <b>拼音</b> card on the 学 tab plays every sound in Microsoft's natural voice.</div></div>
   <div class="pyitems">${items}</div>
   <div class="sec"><h3><span class="tag">读词语</span>拼读词语 <em>Read the pinyin first, then the characters</em></h3><div class="pywords">${words}</div></div>
   ${pyFoot(d.n,1)}</div>`; }
function pyPractice(d){ const L=PY[d.n-1]; if(!L) return ''; const r=rng(d.n*131);
  const reads=L.items.flatMap(it=>it.ex.map(e=>e[0])).slice(0,16).map(y=>`<span><span class="box"></span>${y}</span>`).join('');
  let B='';
  if(L.type==='i'||L.type==='f'){ B=`<div class="sec"><h3><span class="tag">B</span>${L.type==='i'?'填声母':'填韵母'} <em>Fill in the missing ${L.type==='i'?'initial (the first sound)':'final, with its tone mark'}</em></h3><div class="pytable">${pyFill(L).map(x=>`<div class="pyq"><span class="z">${x.w}</span><span class="ln">${x.shown}</span></div>`).join('')}</div></div>`; }
  const C=`<div class="sec"><h3><span class="tag">${B?'C':'B'}</span>标声调 <em>Add the tone marks${L.type==='t'?' — remember today\'s tone rule':''}</em></h3><div class="pytable">${L.words.map(([w,p])=>`<div class="pyq"><span class="z">${w}</span><span class="ln">${noTone(p)}</span></div>`).join('')}</div></div>`;
  const Dp=`<div class="sec"><h3><span class="tag">${B?'D':'C'}</span>圈出正确的拼音 <em>Circle the right spelling</em></h3><div class="pairs">${L.pairs.map(([w,a,b])=>{const o=shuffle([a,b],r);return `<div class="pp"><span class="z">${esc(w)}</span><span>${esc(o[0])}</span><span>${esc(o[1])}</span></div>`}).join('')}</div></div>`;
  const E=`<div class="sec"><h3><span class="tag">${B?'E':'D'}</span>听写 <em>Dictation — in the app tap 拼音 → 听写 and write the pinyin you hear</em></h3><div class="dict6">${[1,2,3,4,5,6].map(i=>`<div>${i}<i></i></div>`).join('')}</div></div>`;
  return `<div class="page">${pyHead(d.n,2,'拼音练习','Pinyin practice')}
   <div class="sec"><h3><span class="tag">A</span>读一读 <em>Read each one aloud — tick it when it sounds right</em></h3><div class="pyreads">${reads}</div></div>
   ${B}${C}${Dp}${E}
   <div class="sec"><h3><span class="tag">✎</span>抄写拼音 <em>Copy the pinyin neatly on the four lines, tone marks included</em></h3><div class="pycopy">${L.words.slice(0,4).map(([w,p])=>`<div><span class="z">${w}</span><div class="py4"></div></div>`).join('')}</div></div>
   ${pyFoot(d.n,2)}</div>`; }
function pyDict(n){ const L=PY[n-1]; if(!L) return []; const all=L.items.flatMap(it=>it.ex).concat(L.words.map(([w,p])=>[p,w])); return shuffle(all,rng(n*977)).slice(0,6); }
function pyAnswers(d){ const L=PY[d.n-1]; if(!L) return '';
  const B=(L.type==='i'||L.type==='f')?`<b>P2-B</b> ${pyFill(L).map(x=>`<span class="z">${x.w}</span> ${x.ans}`).join('　')}<br>`:'';
  const C=`<b>P2-${B?'C':'B'}</b> ${L.words.map(([w,p])=>`<span class="z">${w}</span> ${p}`).join('　')}<br>`;
  const Dp=`<b>P2-${B?'D':'C'}</b> ${L.pairs.map(([w,a])=>`<span class="z">${esc(w)}</span> ${esc(a)}`).join('　')}<br>`;
  const E=`<b>P2-${B?'E':'D'}</b> ${pyDict(d.n).map(([y,z],i)=>`${i+1}. ${y} <span class="z">${z}</span>`).join('　')}<br>`;
  return B+C+Dp+E; }
function page1(d){
  const cards=d.chars.map(c=>{const x=D[c];const w=d.write.includes(c);return `<div class="card"><div class="big">${c}</div><div>
   <div class="py">${x.py}${w?' <span class="w">· write it</span>':''}</div><div class="en">${esc(x.en)}</div>
   <div class="wd"><span class="z">${x.w}</span><span class="p">${x.wp}</span><span class="e">${esc(x.we)}</span></div></div></div>`}).join('');
  return `<div class="page">${header(d.n,1)}
  <div class="note"><b>How to use:</b> read each character out loud 3 times, then say the word. In the app, tap a card to hear it. Characters marked <b style="color:var(--red)">write it</b> are today's handwriting characters (page 4).</div>
  <div class="cards">${cards}</div>${foot(d.n,1)}</div>`;
}
function page2(d){
  const W=d.write; const per=W.length===1?5:W.length===2?4:W.length===3?3:2;
  let rows='';
  W.forEach(c=>{
    const x=D[c];
    rows+=`<div class="sec"><h3><span class="tag">${x.py}</span>${c} <em>${esc(x.en)} · word: ${x.w} ${x.wp}</em></h3>`;
    for(let i=0;i<per;i++){
      const cells=[]; for(let k=0;k<10;k++){ if(i===0&&k===0) cells.push(tz(c,'model')); else if(i===0&&k<5) cells.push(tz(c,'trace')); else if(i>0&&k<2) cells.push(tz(c,'trace')); else cells.push(tz('')); }
      rows+=`<div class="row">${cells.join('')}</div>`;
    }
    rows+=`</div>`;
  });
  // fill remaining with recognition-char tracing
  const extra = d.chars.filter(c=>!W.includes(c)).slice(0, W.length>=4?0:(W.length===3?5:(W.length===2?5:10)));
  let ex='';
  if(extra.length){
    ex=`<div class="sec"><h3><span class="tag">bonus</span>描一描今天的认读字 <em>Trace the rest of today's characters once each</em></h3>`;
    for(let i=0;i<extra.length;i+=5){ const g=extra.slice(i,i+5); ex+=`<div class="row">${g.map(c=>tz(c,'trace')+tz('')).join('')}</div>`; }
    ex+='</div>';
  }
  return `<div class="page">${header(d.n,2)}
  <div class="note"><b>Model → trace → write.</b> Black square = model. Grey = trace over it. Empty = write from memory. Watch the stroke order animation in the app (写 tab) before you start.</div>
  ${rows}${ex}${foot(d.n,2)}</div>`;
}
function copyS(d){
  const ss=d.sent.slice(0,2).map(s=>{const h=[...s.zh].filter(c=>/[\u4e00-\u9fff]/.test(c));return `<div style="display:flex;flex-direction:column;gap:4px"><div style="font-family:var(--hanzi);font-size:16px;color:var(--soft)">${s.zh} <span style="font-family:var(--latin);font-size:10px">${esc(s.en)}</span></div><div class="row" style="--s:.6in">${h.map(()=>`<div class="tzg dash" style="--s:.6in"></div>`).join('')}</div></div>`}).join('');
  return `<div class="sec"><h3><span class="tag">B</span>抄写句子 <em>Copy the sentence, one character per box</em></h3>${ss}</div>`;
}
function page3(d){
  const words=d.chars.map(c=>D[c]);
  const items=words.map(x=>`<div class="word"><div class="pyl">${x.wp.split(' ').map(s=>`<span>${s}</span>`).join('')}</div><div class="row">${[...x.w].map(()=>tz('')).join('')}</div><div class="en">${esc(x.we)}</div></div>`).join('');
  // cumulative writing chars dictation via pinyin
  const r=rng(d.n*31); const pool=shuffle(writeUpTo(d.n),r).slice(0,10);
  const wr=pool.map(c=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:13px;font-weight:500">${D[c].py}</span>${tz('')}</div>`).join('');
  return `<div class="page p3">${header(d.n,3)}
  <div class="sec"><h3><span class="tag">A</span>看拼音，写词语 <em>Write the word in characters. Peek at page 3 only if you're stuck.</em></h3><div class="words">${items}</div></div>
  ${copyS(d)}
  <div class="sec"><h3><span class="tag">C</span>写字复习 <em>Handwriting review — characters you've learned to write so far</em></h3><div style="display:flex;gap:10px;flex-wrap:wrap">${wr}</div></div>
  ${foot(d.n,3)}</div>`;
}
function page4(d){
  const r=rng(d.n*53);
  const A=d.chars.map(c=>`<div class="zy"><div class="py4"></div><span class="z">${c}</span></div>`).join('');
  const T=d.chars.map(c=>`<div class="tone"><span class="z">${c}</span><span class="o">${toneOptions(D[c].py).map(o=>`<span>${o}</span>`).join('')}</span></div>`).join('');
  const left=shuffle(d.chars,r).slice(0,8), right=shuffle(left,r);
  const M=left.map((c,i)=>`<div class="a">${c}<span class="dot"></span></div><div></div><div class="b"><span class="dot"></span>${esc(D[right[i]].en.split(';')[0])}</div>`).join('');
  return `<div class="page">${header(d.n,4)}
  <div class="sec"><h3><span class="tag">A</span>给生字注音 <em>Write the pinyin with tone marks above each character</em></h3><div class="grid5">${A}</div></div>
  <div class="sec"><h3><span class="tag">B</span>圈出正确的读音 <em>Circle the correct tone. Say all four out loud first.</em></h3><div class="tones">${T}</div></div>
  <div class="sec"><h3><span class="tag">C</span>连一连 <em>Draw a line from each character to its meaning</em></h3><div class="match">${M}</div></div>
  ${foot(d.n,4)}</div>`;
}
function page5(d){
  const S=d.sent.map((s,i)=>`<div><div class="s1"><span class="num">${i+1}</span><span>${ruby(s.zh,s.py)}</span><span class="chk">read<span class="box"></span><span class="box"></span><span class="box"></span></span></div><div class="s1"><span class="num"></span><span class="en">${esc(s.en)}</span></div></div>`).join('');
  const r=rng(d.n*71);
  const order=shuffle(d.sent.map((s,i)=>i),r);
  const F=order.map((i,k)=>{const s=d.sent[i];return `<div class="fl"><span style="font-family:var(--latin);font-size:11px;color:var(--red);font-weight:700;width:16px">${k+1}</span>${esc(s.zh).replace(s.blank,'<span class="blank"></span>')}<span class="en">${esc(s.en)}</span></div>`}).join('');
  const bank=shuffle(d.sent.map(s=>s.blank),r).map(c=>`<span>${c}</span>`).join('');
  const tw=shuffle(d.chars,r).slice(0,4).map(c=>`<div class="q">“${esc(D[c].we)}” →</div><div class="ln"></div>`).join('');
  return `<div class="page">${header(d.n,5)}
  <div class="sec"><h3><span class="tag">A</span>朗读 <em>Read each sentence aloud 3 times — tick a box each time</em></h3><div class="sent">${S}</div></div>
  <div class="sec"><h3><span class="tag">B</span>选字填空 <em>Fold the page to hide part A. Fill each blank from the word bank.</em></h3><div class="bank">${bank}</div><div class="fill">${F}</div></div>
  <div class="sec"><h3><span class="tag">C</span>英译中 <em>Write it in Chinese (characters, or pinyin if you can't write it yet)</em></h3><div class="tr">${tw}</div></div>
  ${foot(d.n,5)}</div>`;
}
function page6(d){
  const R=reviewChars(d.n).map(c=>`<div class="rvi"><span class="z">${c}</span><div class="ln"><i>PINYIN</i></div><div class="ln"><i>MEANING</i></div></div>`).join('');
  const r=rng(d.n*89); const pool=shuffle(writeUpTo(d.n),r).slice(0,8);
  const DI=pool.map(c=>`<div class="it">${tz('')}<span>${esc(D[c].en.split(';')[0])}</span></div>`).join('');
  const prev=d.n>1?day(d.n-1):d;
  const RD=prev.sent.map(s=>s.zh).join('　');
  return `<div class="page">${header(d.n,6)}
  <div class="sec"><h3><span class="tag">A</span>旧字复习 <em>Characters from Day ${d.n>1?[d.n-1,d.n-3,d.n-7].filter(x=>x>0).join(', '):'1'} — write pinyin and meaning</em></h3><div class="rv">${R}</div></div>
  <div class="sec"><h3><span class="tag">B</span>默写 <em>Write the character from memory</em></h3><div class="dict">${DI}</div></div>
  <div class="sec"><h3><span class="tag">C</span>无拼音阅读 <em>${d.n>1?'Yesterday\'s sentences — no pinyin this time. Read aloud.':'Read today\'s sentences without pinyin.'}</em></h3><div class="read">${esc(RD)}</div></div>
  <div class="sec"><h3><span class="tag">✓</span>今日打卡 <em>Check off when done</em></h3><div class="checks">
   <span><span class="box"></span> 6 pages done</span><span><span class="box"></span> App practice done</span><span><span class="box"></span> Checked answers</span><span><span class="box"></span> Said every new word aloud</span><span>Hardest character today: <span style="display:inline-block;width:60px;border-bottom:1px solid var(--soft)"></span></span></div></div>
  ${foot(d.n,6)}</div>`;
}
function answers(ds){
  let pages='';
  for(let i=0;i<ds.length;i+=3){
    const part=ds.slice(i,i+3).map(d=>{
      const r4=d.chars.map(c=>`<span class="z">${c}</span> ${D[c].py}`).join('　');
      const r3=d.chars.map(c=>`${D[c].wp} = <span class="z">${D[c].w}</span>`).join('；');
      const r=rng(d.n*71); const order=shuffle(d.sent.map((s,i)=>i),r);
      const r5=order.map((i,k)=>`${k+1}. <span class="z">${d.sent[i].blank}</span>`).join('　'); shuffle(d.sent.map(s=>s.blank),r); const r5c=shuffle(d.chars,r).slice(0,4).map(c=>`${esc(D[c].we)} = <span class="z">${D[c].w}</span>`).join('；');
      const rv=reviewChars(d.n).map(c=>`<span class="z">${c}</span> ${D[c].py} ${esc(D[c].en.split(';')[0])}`).join('；');
      const r6b=shuffle(writeUpTo(d.n),rng(d.n*89)).slice(0,8).map(c=>`<span class="z">${c}</span> ${esc(D[c].en.split(';')[0])}`).join('；');
      const r3b=shuffle(writeUpTo(d.n),rng(d.n*31)).slice(0,10).map(c=>`${D[c].py} <span class="z">${c}</span>`).join('　');
      return `<div><h4>第${cnNum(d.n)}天 · Day ${d.n}</h4>
      ${pyAnswers(d)}<b>P5-A</b> ${r3}<br><b>P5-C</b> ${r3b}<br><b>P6-A/B</b> ${r4}<br><b>P7-B</b> ${r5}<br><b>P7-C</b> ${r5c}<br><b>P8-A</b> ${rv}<br><b>P8-B</b> ${r6b}</div>`;
    }).join('');
    pages+=`<div class="page"><div class="hd"><div class="l"><span class="dayno">答案</span><span class="ttl">Answer key<small>Days ${ds[i].n}–${ds[Math.min(i+2,ds.length-1)].n}</small></span></div><div class="r">Page 6 C (matching): check with page 3</div></div><div class="ak">${part}</div></div>`;
  }
  return pages;
}

<script>window.ABC_EXTRA={"passages": [{"day": 5, "title": "山上", "te": "On the mountain", "zh": "爸爸妈妈上山。山上有云，有花，有鸟，有虫。爸爸坐在石头上画马，妈妈站在花下画鸟。下雨了，风不大。我打电话：“爸爸，下雨了！”", "py": "bà ba mā ma shàng shān shān shang yǒu yún yǒu huā yǒu niǎo yǒu chóng bà ba zuò zài shí tou shang huà mǎ mā ma zhàn zài huā xià huà niǎo xià yǔ le fēng bú dà wǒ dǎ diàn huà bà ba xià yǔ le", "en": "Mom and Dad sketch horses and birds on the mountain until it starts to rain."}, {"day": 10, "title": "秋天的晚上", "te": "An autumn evening", "zh": "今天是秋天的第一天。早上，我在家里看书。下午下了一场雨，雨大，风也大。晚上雨不下了，天上的星星一闪一闪的。妈妈说：“明天是个好天气。”", "py": "jīn tiān shì qiū tiān de dì yī tiān zǎo shang wǒ zài jiā lǐ kàn shū xià wǔ xià le yì chǎng yǔ yǔ dà fēng yě dà wǎn shang yǔ bú xià le tiān shang de xīng xing yì shǎn yì shǎn de mā ma shuō míng tiān shì gè hǎo tiān qì", "en": "First day of autumn: reading at home, an afternoon storm, stars at night."}, {"day": 15, "title": "小猫", "te": "The little cat", "zh": "家里有一只小黄猫。我在桌子边看书，猫也坐在桌子上看我。我去开门，猫也走到门边。我在家里走来走去，猫也走来走去。妈妈说：“小猫是你的影子。”", "py": "jiā lǐ yǒu yì zhī xiǎo huáng māo wǒ zài zhuō zi biān kàn shū māo yě zuò zài zhuō zi shang kàn wǒ wǒ qù kāi mén māo yě zǒu dào mén biān wǒ zài jiā lǐ zǒu lái zǒu qù māo yě zǒu lái zǒu qù mā ma shuō xiǎo māo shì nǐ de yǐng zi", "en": "A little yellow cat follows me everywhere at home. Mom says it's my shadow."}, {"day": 20, "title": "生日", "te": "Birthday", "zh": "昨天是我的生日。朋友们给我买了一个大蛋糕，上面有红色和黄色的花。我们一起唱生日歌。朋友问我：“你今年几岁？”我笑着说：“你猜！”", "py": "zuó tiān shì wǒ de shēng rì péng you men gěi wǒ mǎi le yí gè dà dàn gāo shàng miàn yǒu hóng sè hé huáng sè de huā wǒ men yì qǐ chàng shēng rì gē péng you wèn wǒ nǐ jīn nián jǐ suì wǒ xiào zhe shuō nǐ cāi", "en": "Friends bring a birthday cake and ask how old I am. \"Guess!\""}, {"day": 25, "title": "上班", "te": "At work", "zh": "我在一家公司工作。我的同事都很好。中午我们常常一起去吃饭，我最喜欢点牛肉面。老板说：“下个月我们去海边。”大家都很开心，我觉得时间过得真快。", "py": "wǒ zài yì jiā gōng sī gōng zuò wǒ de tóng shì dōu hěn hǎo zhōng wǔ wǒ men cháng cháng yì qǐ qù chī fàn wǒ zuì xǐ huan diǎn niú ròu miàn lǎo bǎn shuō xià gè yuè wǒ men qù hǎi biān dà jiā dōu hěn kāi xīn wǒ jué de shí jiān guò de zhēn kuài", "en": "Lunch with coworkers, beef noodles, and a company beach trip next month."}, {"day": 30, "title": "回中国", "te": "Back to China", "zh": "好久不见！上个月我回中国看爷爷奶奶。爷爷今年八十岁了，身体还很好，每天早上去公园走路。奶奶给我做了很多好吃的。回美国以前，奶奶说：“有时间就回来，我们在家等你。”", "py": "hǎo jiǔ bú jiàn shàng gè yuè wǒ huí zhōng guó kàn yé ye nǎi nai yé ye jīn nián bā shí suì le shēn tǐ hái hěn hǎo měi tiān zǎo shang qù gōng yuán zǒu lù nǎi nai gěi wǒ zuò le hěn duō hǎo chī de huí měi guó yǐ qián nǎi nai shuō yǒu shí jiān jiù huí lai wǒ men zài jiā děng nǐ", "en": "Visiting grandparents in China: Grandpa is 80 and still walks every morning."}], "parts": {"地": ["土", "也"], "你": ["亻", "尔"], "他": ["亻", "也"], "站": ["立", "占"], "坐": ["人", "人", "土"], "对": ["又", "寸"], "云": ["二", "厶"], "花": ["艹", "化"], "妈": ["女", "马"], "打": ["扌", "丁"], "棋": ["木", "其"], "鸡": ["又", "鸟"], "字": ["宀", "子"], "词": ["讠", "司"], "语": ["讠", "吾"], "纸": ["纟", "氏"], "音": ["立", "日"], "妹": ["女", "未"], "奶": ["女", "乃"], "桥": ["木", "乔"], "雪": ["雨", "彐"], "草": ["艹", "早"], "家": ["宀", "豕"], "路": ["足", "各"], "灯": ["火", "丁"], "秋": ["禾", "火"], "树": ["木", "对"], "叶": ["口", "十"], "闪": ["门", "人"], "星": ["日", "生"], "江": ["氵", "工"], "莲": ["艹", "连"], "说": ["讠", "兑"], "蛙": ["虫", "圭"], "男": ["田", "力"], "好": ["女", "子"], "远": ["辶", "元"], "近": ["辶", "斤"], "听": ["口", "斤"], "猫": ["犭", "苗"], "边": ["辶", "力"], "鸭": ["甲", "鸟"], "苹": ["艹", "平"], "杏": ["木", "口"], "桃": ["木", "兆"], "作": ["亻", "乍"], "笔": ["⺮", "毛"], "课": ["讠", "果"], "早": ["日", "十"], "校": ["木", "交"], "明": ["日", "月"], "尘": ["小", "土"], "从": ["人", "人"], "众": ["人", "人", "人"], "双": ["又", "又"], "林": ["木", "木"], "森": ["木", "木", "木"], "红": ["纟", "工"], "歌": ["哥", "欠"], "晚": ["日", "免"], "昨": ["日", "乍"], "狗": ["犭", "句"], "朋": ["月", "月"], "尾": ["尸", "毛"], "谁": ["讠", "隹"], "短": ["矢", "豆"], "把": ["扌", "巴"], "最": ["日", "取"], "公": ["八", "厶"], "诗": ["讠", "寺"], "给": ["纟", "合"], "们": ["亻", "门"], "彩": ["采", "彡"], "空": ["穴", "工"], "问": [ const tick=()=>new Promise(r=>setTimeout(r,30));
async function buildPdf(n,answers,onP){
  const {jsPDF}=window.jspdf;
  const host=document.createElement('div'); host.className='sheets'; host.style.cssText='position:fixed;left:-12000px;top:0;width:816px;zoom:1';
  host.innerHTML=answers?SHEETS.answers(n):SHEETS(n); document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    const pages=[...host.querySelectorAll('.page')];
    const pdf=new jsPDF({unit:'pt',format:'letter',compress:true});
    for(let i=0;i<pages.length;i++){
      onP(i,pages.length); await tick();
      const c=await html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      if(i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,0,612,792);

    }
    return pdf.output('blob');
  } finally { host.remove(); }

async function savePdf(n,btn,answers){
  if(BUSY) return; BUSY=true;

  try{
    if(DL===undefined) DL=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;
    let blob=null;
    busy(true,'正在准备 PDF',answers?'答案':`第${cnNum(n)}天 · 8 页`,8);
    // build the PDF right here from the pages (same method as Phoebie's Tutor) — no network fetch that can hang
    if(!window.jspdf||!window.html2canvas){ busy(false); toast('PDF 工具没有载入，请检查网络后再按一次'); return; }
    blob=await buildPdf(n,answers,(i,t)=>busy(true,'正在生成 PDF',`第 ${i+1} / ${t} 页`,10+Math.round(i/t*85)));
    busy(true,'PDF 已准备好',DL?'请在弹出的框里选“保存”':'正在下载…',100);
    if(DL) await DL.save({filename:name,data:blob});
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000); }
    busy(false);

}

   <div class="row" style="justify-content:space-between"><b>怎么打印 How to print</b></div>
   <div class="row" style="margin:12px 0"><button class="btn print" id="savePdf">${PRN} 保存第${cnNum(d.n)}天 8 页 PDF</button><button class="btn" id="saveAns">保存答案 PDF</button></div>
   <ol style="margin:0;padding-left:20px;color:var(--muted)">
    <li>按上面的红色按钮，在弹出的确认框里选“保存”。</li>
    <li>打开刚保存的 PDF（Mac：下载文件夹；iPhone/iPad：“文件”App），按 ⌘P 或分享 → 打印。纸张选 Letter。</li>
    <li>备用：聊天里的 “每日中文_30天打印练习_240页.pdf”，打印第 <b style="color:var(--seal)">${a}–${b}</b> 页也是同样的 8 页。</li>
   </ol>
   <div class="startset"><label for="voiceSel">发音 Voice</label><select id="voiceSel"><option value="__ms" ${!S.voice?'selected':''}>★ 微软神经语音 Xiaoxiao（录好的，推荐）</option>${VOICES.length?VOICES.map(v=>`<option value="${esc(v.name)}" ${S.voice===v.name?'selected':''}>${esc(v.name)}${isNeural(v)?' ★ 微软神经':''}</option>`).join(''):''}</select><button class="btn ghost" id="vTest" type="button">${SPK} 试听</button></div>
   <p class="sub" style="margin:6px 0 0;font-size:12.5px">所有字、词、句子和短文都用微软神经语音 Xiaoxiao 录好了，在手机、iPad、电脑上都一样。下面的设备语音只在选择时使用。 <span id="packStat"></span></p>
   <div class="startset"><label for="startDate">课程开始日期 Start date</label><input type="date" id="startDate" value="${S.start}"><span>Day 1 = this date; the app moves to the next day every morning.</span></div>
   <p class="sub" style="margin:8px 0 0;font-size:12.5px" id="syncStat"></p>
  </div>
  <p class="sub" style="margin:0 0 10px">预览 Preview — 和保存的 PDF 一样</p><div class="sheetwrap"><div id="sheets" class="sheets">${SHEETS(d.n)}</div></div>`;
  fitSheets(); setSync(S._sync||'');
  $('#savePdf').onclick=e=>savePdf(d.n,e.currentTarget);
  const vs=$('#voiceSel'); if(vs) vs.onchange=()=>{ S.voice=vs.value==='__ms'?null:vs.value; save(); pickVoice(); print(); say('你好，我们一起学中文。'); };
  $('#vTest').onclick=()=>say('你好，我们一起学中文。');
  const ps=()=>{ const el=$('#packStat'); if(!el) return; const st=PSTATE[d.n]; el.innerHTML=st==='ok'?'<b style="color:var(--ok)">✓ 第'+cnNum(d.n)+'天录音已载入</b>':st?'<b style="color:var(--bad)">录音载入失败（'+esc(st)+'），暂时用设备语音</b>':'录音载入中…'; };
  ps(); loadPack(d.n).then(ps,ps);
  $('#saveAns').onclick=e=>savePdf(d.n,e.currentTarget,true);
  $('#startDate').onchange=e=>{ if(!e.target.value) return; S.start=e.target.value; S.startManual=1; S.day=todayDay(); save(); header(); render(); toast('今天是第'+cnNum(S.day)+'天'); };
}
S.day=todayDay(); save();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ const T=todayDay(); if(S._last!==today()){ S._last=today(); S.day=T; save(); header(); render(); } } });
S._last=today();
header(); render(); startSync();
</script>

</body>
</html>
