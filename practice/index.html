function wordOptions(w){const r=rng("opt"+w);const set=new Set([w]);
  const chars=w.split("");
  // 1) swap one character with its look-alike
  shuffle(r,chars.map((c,i)=>i)).forEach(i=>{if(set.size>=3)return;const L=LOOK[chars[i]];if(L){const v=chars.slice();v[i]=L;set.add(v.join(""))}});
  // 2) real words that share a character
  shuffle(r,POOL.map(p=>p[0]).filter(x=>x!==w&&x.split("").some(c=>chars.includes(c)))).forEach(x=>{if(set.size<4)set.add(x)});
  // 3) any other words

  return shuffle(r,[...set].slice(0,4));}

const CHAIR=x=>`<path d="M${x} 40 L${x} 88 M${x} 64 L${x+18} 64 L${x+18} 88 M${x+18} 64 L${x+18} 64" stroke="#8A7560" stroke-width="3" fill="none"/>`;
const TRI=(x,y,s)=>`<path d="M${x} ${y} L${x+s} ${y} L${x+s/2} ${y-s*.87}Z" fill="none" stroke="#43AA8B" stroke-width="2.5"/>`;
const TRUSS=(x,y,n,s,c="#43AA8B")=>{let o=`<line x1="${x}" y1="${y}" x2="${x+n*s}" y2="${y}" stroke="${c}" stroke-width="2.5"/><line x1="${x+s/2}" y1="${y-s*.8}" x2="${x+n*s-s/2}" y2="${y-s*.8}" stroke="${c}" stroke-width="2.5"/>`;for(let k=0;k<n;k++)o+=`<path d="M${x+k*s} ${y} L${x+k*s+s/2} ${y-s*.8} L${x+k*s+s} ${y}" stroke="${c}" stroke-width="2.5" fill="none"/>`;return o};
const BOTTLE=(x,y)=>`<path d="M${x} ${y+20} L${x} ${y+70} L${x+44} ${y+70} L${x+44} ${y+20}" fill="#EAF4FB" stroke="#8AB4D8" stroke-width="1.5"/><path d="M${x-2} ${y} L${x+46} ${y} L${x+28} ${y+30} L${x+28} ${y+38} L${x+16} ${y+38} L${x+16} ${y+30}Z" fill="#F4FAFE" stroke="#8AB4D8" stroke-width="1.5"/>`;
const LAYERS=(x,y,order)=>{const col={cotton:"#FFFFFF",sand:"#E9C98A",rocks:"#9AA0A6"};const ys=[[y+22,8],[y+14,8],[y+6,8]];return order.map((m,k)=>{const [yy,h]=ys[k];const inset=(yy-y)*.55;return `<path d="M${x+inset} ${yy+h} L${x+44-inset} ${yy+h} L${x+44-inset+h*.55} ${yy} L${x+inset-h*.55} ${yy}Z" fill="${col[m]}" stroke="#B0A08A" stroke-width=".8"/>`}).join("")};

"Paper Tower":{safe:"Ask before using scissors. Clear a flat table.",how:[["Ask","Roll a sheet into a tube and tape it. Fold another into a triangle prism. Press each with your hand: which one is harder to squash?"],["Plan","Draw 2 towers on scratch paper. Label where the tubes go and where the tape goes. Pick the one you think is stronger."],["Create","Set a 15-minute timer. Build a wide base first (at least 3 legs). Tape every joint all the way around."],["Test","Put the book flat on top. Count slowly: one-Mississippi… up to 10. Measure the height from the table to the top with the ruler."],["Improve","Change only ONE thing (more legs, shorter tubes, wider base), then test again and write the new height."]],fair:"Use the same book and the same amount of tape every time.",sci:"Tubes and triangles spread the push of the book evenly, so they don't bend. A wide base stops the tower from tipping.",stuck:["Tower leans? Make the base wider.","Tube crushes? Use 2 sheets rolled together.","Running out of tape? Tape only the joints, not the whole tube."],trials:{rows:["Tower 1","Tower 2"],n:1,unit:"cm",lab:"Height"}},
"Paper Airplane Test":{safe:"Throw only in an empty hallway, never toward people or pets.",
 fold:{"Classic dart":["Fold the paper in half the long way, then open it.","Fold the two top corners in to the middle crease.","Fold the new slanted edges in to the middle again (sharp nose).","Fold the plane in half along the middle crease.","Fold each side down to make wings, lining the wing edge up with the bottom of the plane."],
       "Wide-wing glider":["Fold in half the long way, then open it.","Fold the top edge down about 5 cm (2 inches).","Fold the top corners in to the middle crease.","Fold the small point at the tip back up so the nose is blunt.","Fold in half, then fold wide, flat wings about 2 cm from the bottom."]},
 how:[["Set up","Put a piece of tape on the floor as the start line. Lay the tape measure out along the hallway."],["Throw","Stand with your toes on the line. Hold each plane underneath, near the front. Throw gently and level, at shoulder height, the same way every time."],["Measure","Measure from the start line to where the nose first touches the floor (not where it slides to). Round to the nearest 0.1 m."],["Average","Add the 3 throws and divide by 3. The table below does it for you, but check one by hand!"],["Change one thing","Clip a paper clip to the nose of the farther plane. Throw it 3 more times."]],
 fair:"Same thrower, same line, same throw, same paper. Change only the wing shape (then only the paper clip).",
 sci:"Wings push air down, and the air pushes the plane up (lift). A dart is sleek, so there is less drag (air pushing back). A glider has big wings, so it has more lift and floats. A paper clip adds weight to the nose, which can stop the plane from tipping up and stalling.",
 stuck:["Nose dives? Bend the back edges of the wings up a tiny bit.","Climbs and drops? Bend the back edges down a little, or add the paper clip.","Turns to one side? Make sure both wings are the same size and shape."],

"Balloon Rocket":{safe:"Tie the string to chairs, not to people. Don't let go near faces.",how:[["Set up","Tie one end of the string to a chair. Thread the straw on, then pull the string tight and tie it to another chair 4 m away."],["Load","Blow up the balloon and pinch the neck (don't tie it). Tape it under the straw with 2 strips of tape, neck pointing toward the start chair."],["Launch","Slide it back to the start, let go, and watch!"],["Measure","Measure from the start to where the straw stopped."],["Change one thing","Use more (or less) air, count your breaths so you know, and test again."]],fair:"Same string, same straw, same balloon. Change only the amount of air.",sci:"Air rushes out the back (action) and pushes the balloon forward (reaction). That's Newton's third law, the same idea as a real rocket.",stuck:["Balloon spins? Tape it straight along the straw.","Stops early? Pull the string tighter.","Air leaks before launch? Pinch the neck tighter until you let go."],trials:{rows:["Small breath","Big breath"],n:2,unit:"cm",lab:"Try"}},
"Egg (or Grape) Drop":{safe:"Use a grape. Use a raw egg only with an adult, over a plastic bag or outside.",how:[["Design","Sketch your package: something soft inside (cotton) and something that slows the fall (a parachute from the plastic bag)."],["Predict","Write yes or no: will the grape survive? Why?"],["Drop","An adult holds the ruler or tape measure. Hold the package at 1 m and let go (don't throw)."],["Check","Open it and look: no squish, a little squish, or squashed?"],["Improve","Change ONE thing and drop from 1.5 m."]],fair:"Same grape size, same height, same way of letting go.",sci:"A soft landing makes the stop take longer, so the push on the grape is smaller. A parachute adds air resistance and slows the fall.",stuck:["Squished? Add more cotton all around, not just below.","Parachute tangles? Use 4 strings the same length.","Package tips over? Put the heavy part at the bottom."],trials:{rows:["1 m drop","1.5 m drop"],n:1,unit:"squish 0–2",lab:"Result"}},
"Water Filter":{safe:"Never drink the water, even if it looks clean. Ask an adult to cut the bottle.",how:[["Set up","An adult cuts the bottle in half. Turn the top half upside down into the bottom half, like a funnel. Put the coffee filter in the neck."],["Layers","Add cotton first (bottom), then sand, then small rocks on top."],["Pour","Pour half a cup of muddy water slowly over the rocks."],["Compare","Hold the clean cup next to the muddy one. Rate cloudiness: 1 = clear, 5 = very muddy."],["Change one thing","Swap the layer order, use fresh materials, and pour again."]],fair:"Same amount of muddy water, poured at the same speed.",sci:"Big rocks catch big bits, sand catches small bits, cotton and the filter catch the tiniest bits. Soil and rock underground clean rainwater the same way.",stuck:["Water runs too fast? Add more sand.","Nothing comes out? Use less cotton or loosen it.","Still cloudy? Pour it through a second time."],trials:{rows:["Order 1","Order 2"],n:1,unit:"1–5",lab:"Cloudiness"}},
"Straw Bridge":{safe:"Keep the pennies away from little kids and pets.",how:[["Plan","Draw a bridge using triangles on scratch paper. Make it about 25 cm long so it rests on both books."],["Build","Tape straws into triangles first, then join the triangles together side by side."],["Place","Put the bridge across the 20 cm gap. Set the cup in the middle."],["Load","Add pennies one at a time. Count out loud."],["Record","Stop when it bends a lot or falls. Write the last number it held."]],fair:"Same gap, same cup, cup always in the middle.",sci:"A triangle cannot change shape unless a side breaks, so the push spreads along the straws. Squares can squash into diamonds.",stuck:["Sags in the middle? Add a triangle underneath.","Slides off? Tape the ends to the books.","Joints pop? Wrap tape around twice."],trials:{rows:["Bridge 1","Bridge 2"],n:1,unit:"pennies",lab:"Held"}},

function robotPuzzle(r){const dirs={U:[0,1],D:[0,-1],L:[-1,0],R:[1,0]};const arrows={U:"↑",D:"↓",L:"←",R:"→"};
 let x=0,y=0;const prog=[];for(let i=0;i<4;i++){const d=pick(r,["U","R","R","U","L","D"]);const n=ri(r,1,3);prog.push([d,n]);x+=dirs[d][0]*n;y+=dirs[d][1]*n}
 const ok=`(${x}, ${y})`;const opts=new Set([ok]);let g=0;while(opts.size<3&&g++<20)opts.add(`(${x+ri(r,-2,2)}, ${y+ri(r,-2,2)})`);
 return{prog,prompt:`A robot starts at (0, 0). Right is +x, up is +y. Program: ${prog.map(([d,n])=>arrows[d]+" "+n).join(",  ")}. Where does it stop?`,choice:shuffle(r,[...opts]),ok}}

function svgRobot(prog,show){const dirs={U:[0,1],D:[0,-1],L:[-1,0],R:[1,0]};let x=0,y=0;const pts=[[0,0]];prog.forEach(([d,n])=>{for(let k=0;k<n;k++){x+=dirs[d][0];y+=dirs[d][1];pts.push([x,y])}});
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const minx=Math.min(0,...xs)-1,maxx=Math.max(0,...xs)+1,miny=Math.min(0,...ys)-1,maxy=Math.max(0,...ys)+1;const cs=Math.min(28,260/(maxx-minx+1),180/(maxy-miny+1));
 const X=v=>20+(v-minx)*cs+cs/2,Y=v=>16+(maxy-v)*cs+cs/2;const Wd=40+(maxx-minx+1)*cs,Hd=32+(maxy-miny+1)*cs;let g="";
 for(let i=minx;i<=maxx;i++)for(let j=miny;j<=maxy;j++)g+=`<rect x="${20+(i-minx)*cs}" y="${16+(maxy-j)*cs}" width="${cs}" height="${cs}" fill="${i===0&&j===0?"#FFE7A8":"#fff"}" stroke="#D8E2F0"/>`;
 const path="M"+pts.map(p=>X(p[0])+" "+Y(p[1])).join(" L");
 return `<svg class="ill" viewBox="0 0 ${Wd} ${Hd}">${g}<text x="${X(0)}" y="${Y(0)+4}" text-anchor="middle" font-size="10" fill="#B7791F">start</text>${show?`<path d="${path}" stroke="#E0453A" stroke-width="3" fill="none" stroke-dasharray="4 3"/><g><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#5B8DEF"/><circle cx="-4" cy="-2" r="2" fill="#fff"/><circle cx="4" cy="-2" r="2" fill="#fff"/><animateMotion dur="${pts.length*.35}s" fill="freeze" path="${path}"/></g>`:`<g transform="translate(${X(0)} ${Y(0)})"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#5B8DEF"/><circle cx="-4" cy="-2" r="2" fill="#fff"/><circle cx="4" cy="-2" r="2" fill="#fff"/></g>`}</svg>`}

(function(){
 const wrap=document.createElement('div');wrap.id='scr';
 wrap.innerHTML='<div class="scrbar"><button data-tool="pen" class="on">✏️ Pen</button><button data-tool="red">🔴 Red</button><button data-tool="eraser">🧽 Eraser</button><button data-act="undo">↩︎ Undo</button><button data-act="clear">🗑 Clear</button><span style="flex:1"></span><button data-act="close" style="font-weight:800">Done ✕</button><div class="q" id="scrQ"></div></div><canvas id="scrC"></canvas>';
 document.body.appendChild(wrap);
 const fab=document.createElement('button');fab.id='scrFab';fab.textContent='✏️ Scratch';document.body.appendChild(fab);
 const cv=wrap.querySelector('canvas'),ctx=cv.getContext('2d');let tool='pen',strokes=[],cur=null;
 function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);redraw()}
 function draw(st){if(st.pts.length<1)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  if(st.t==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=28}else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=st.t==='red'?'#D7263D':'#1d2b3a';ctx.lineWidth=3.2}
  ctx.beginPath();ctx.moveTo(st.pts[0][0],st.pts[0][1]);for(let i=1;i<st.pts.length;i++){const a=st.pts[i-1],b=st.pts[i];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}
  if(st.pts.length===1)ctx.lineTo(st.pts[0][0]+.1,st.pts[0][1]);ctx.stroke();ctx.restore()}
 function redraw(){ctx.clearRect(0,0,cv.width,cv.height);strokes.forEach(draw)}
 const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={t:tool,pts:[pos(e)]};strokes.push(cur);redraw()});
 cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];ev.forEach(x=>cur.pts.push(pos(x)));redraw()});
 const end=()=>{cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 function open(q){document.getElementById('scrQ').textContent=q||'';wrap.classList.add('on');fab.style.display='none';requestAnimationFrame(size)}
 function close(){wrap.classList.remove('on');fab.style.display=''}
 window.addEventListener('resize',()=>{if(wrap.classList.contains('on'))size()});
 fab.addEventListener('click',()=>open(''));
 document.addEventListener('click',e=>{const b=e.target.closest('[data-scratch]');if(b){e.stopPropagation();if(b.dataset.scratch!==document.getElementById('scrQ').textContent)strokes=[];open(b.dataset.scratch)}},true);
 wrap.querySelector('.scrbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tool){tool=b.dataset.tool;wrap.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.dataset.act==='undo'){strokes.pop();redraw()}if(b.dataset.act==='clear'){strokes=[];redraw()}if(b.dataset.act==='close')close()});
})();
load();
</script>
